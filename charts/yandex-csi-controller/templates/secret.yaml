{{- if or .Values.serviceAccountJSON .Values.nodeServiceAccountJSON }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "yandex-csi-controller.name" . }}
type: Opaque
data:
  {{- with .Values.serviceAccountJSON }}
  serviceAccountJSON: {{ . }}
  {{- end }}
  {{- with .Values.nodeServiceAccountJSON }}
  nodeServiceAccountJSON: {{ . }}
  {{- end }}
{{- end }}
