apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "yandex-csi-node.name" . }}
  {{- with .Values.node.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "yandex-csi-controller.name" . }}
  {{- with .Values.controller.serviceAccountAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
