serviceAccountJSON: ""
# base64-encoded key of an SA with compute.viewer; empty: node pods use serviceAccountJSON
nodeServiceAccountJSON: ""
folderID: ""
# cluster_uuid label on disks and snapshots; empty: kube-system namespace UID
# (looked up at install; under `helm template` the driver falls back to "default")
clusterUUID: ""

# defaultStorageclass: 
# "yc-network-hdd"
# "yc-network-ssd"
# "yc-network-ssd-nonreplicated" 
defaultStorageclass: "yc-network-hdd"

sidecars:
  nodeDriverRegistrar:
    image:
      pullPolicy: IfNotPresent
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.18.0

    extraArgs:
      v: 2
    resources: {}
    securityContext: {}

    # terminationMessagePath: /dev/termination-log
    # terminationMessagePolicy: File
          
  provisioner:
    image:
      pullPolicy: IfNotPresent
      repository: registry.k8s.io/sig-storage/csi-provisioner
      tag: v6.4.0

    extraArgs:
      default-fstype: ext4
      feature-gates: "Topology=true"
      worker-threads: 10
      v: 5
      timeout: 600s
      extra-create-metadata: true
      

    resources: {}
    securityContext: {}

    # terminationMessagePath: /dev/termination-log
    # terminationMessagePolicy: File


  attacher:
    image: 
      pullPolicy: IfNotPresent
      repository: registry.k8s.io/sig-storage/csi-attacher
      tag: v4.13.0

    extraArgs:
      v: 5
      timeout: 600s
      worker-threads: 10

    resources: {}
    securityContext: {}

    # terminationMessagePath: /dev/termination-log
    # terminationMessagePolicy: File

  resizer:
    image: 
      pullPolicy: IfNotPresent
      repository: registry.k8s.io/sig-storage/csi-resizer
      tag: v2.3.0

    extraArgs:
      v: 5
      timeout: 600s
      workers: 10

    resources: {}
    securityContext: {}

    # terminationMessagePath: /dev/termination-log
    # terminationMessagePolicy: File


  snapshotter:
    image: 
      pullPolicy: IfNotPresent
      repository: registry.k8s.io/sig-storage/csi-snapshotter
      tag: v8.7.0

    extraArgs:
      v: 5
      timeout: 600s
      worker-threads: 10

    resources: {}
    securityContext: {}

    # terminationMessagePath: /dev/termination-log
    # terminationMessagePolicy: File

image: 
  pullPolicy: IfNotPresent
  repository: ghcr.io/nikolaymatrosov/yandex-csi-driver
  # Overrides the image tag whose default is v{{ .Chart.AppVersion }}
  tag: ""

defaults:
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      ephemeral-storage: 50Mi
      cpu: 100m
      memory: 128Mi


  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true

  terminationMessagePath: /dev/termination-log
  terminationMessagePolicy: File

  csiPath: /csi/
  csiSockName: csi.sock
  csiPluginName: yandex.csi.nikolaymatrosov.ru
  kubeletPath: /var/lib/kubelet

controller:
  ports:
    addressPort: 12312

  extraArgs: {}
  resources: {}

node:
  ports:
    addressPort: 12412

  extraArgs:
    v: 5

  resources: {}
  securityContext:
    privileged: true
    readOnlyRootFilesystem: true
