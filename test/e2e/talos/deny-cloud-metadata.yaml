# Конфиг Talos (с CA-ключами) лежит в user-data метаданных ВМ. Подам туда ходить незачем.
# enableDefaultDeny=false: политика только запрещает метаданные, остальной трафик не трогает.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-cloud-metadata
spec:
  endpointSelector: {}
  enableDefaultDeny:
    egress: false
    ingress: false
  egressDeny:
    - toCIDR:
        - 169.254.169.254/32
